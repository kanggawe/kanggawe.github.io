<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="esanetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081426" />
      <stop offset="50%" stop-color="#0d233a" />
      <stop offset="100%" stop-color="#11324d" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.8" />
    </linearGradient>

    <!-- Signal Gradient -->
    <linearGradient id="signalGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Core Dot Gradient -->
    <linearGradient id="coreDot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#2dd4bf" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#esanetBg)" stroke="url(#borderGlow)" stroke-width="12" />

  <!-- Inner Soft Light Ring -->
  <rect x="36" y="36" width="440" height="440" rx="98" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- WiFi Broadcast Waves (ESANET Emblem) with Filter Glow -->
  <g filter="url(#glow)">
    <!-- Top Large Outer Wave -->
    <path d="M 120 185 A 195 195 0 0 1 392 185" 
          fill="none" 
          stroke="url(#signalGrad)" 
          stroke-width="36" 
          stroke-linecap="round" />

    <!-- Middle Wave -->
    <path d="M 166 245 A 130 130 0 0 1 346 245" 
          fill="none" 
          stroke="url(#signalGrad)" 
          stroke-width="34" 
          stroke-linecap="round" />

    <!-- Inner Small Wave -->
    <path d="M 212 305 A 65 65 0 0 1 300 305" 
          fill="none" 
          stroke="url(#signalGrad)" 
          stroke-width="32" 
          stroke-linecap="round" />

    <!-- Center Pulse Core Dot -->
    <circle cx="256" cy="370" r="28" fill="url(#coreDot)" />
  </g>
</svg>
